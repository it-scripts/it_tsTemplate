name: Automatic FiveM Resource Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Root & Web Dependencies
        run: |
          npm install
          npm --prefix web install

      - name: Build & Package FiveM Resource
        run: |
          npm run package

      - name: Determine Release Tag & Resource Name
        id: vars
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG_NAME"
          echo "Resource Name: $PKG_NAME"

      - name: Generate Conventional Changelog
        run: |
          node scripts/changelog.mjs release_notes.md
        env:
          PKG_NAME: ${{ steps.vars.outputs.pkg_name }}
          TAG_NAME: ${{ steps.vars.outputs.tag }}

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          body_path: release_notes.md
          files: |
            release/${{ steps.vars.outputs.pkg_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
